name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:11
      - name: Lint
        run: find app tests demo -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer, phpstan:2.3
          coverage: none
      - name: Install AtroPIM (PHPStan needs its classes)
        run: |
          mkdir -p "$RUNNER_TEMP/atro"
          cp demo/project/composer.json "$RUNNER_TEMP/atro/"
          composer install -d "$RUNNER_TEMP/atro" --no-dev --no-scripts --no-plugins --ignore-platform-reqs --no-interaction --no-progress --prefer-dist
      - name: PHPStan
        run: ATRO_VENDOR="$RUNNER_TEMP/atro/vendor" phpstan analyse --no-progress --memory-limit=2G --error-format=github

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["3306:3306"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the demo image (AtroPIM with the module)
        run: docker build -f demo/Dockerfile -t supertext-atropim-demo . 2>&1 | tee build.log
      - name: Start the stand-in API
        run: node tests/docs/stand-in.mjs > stand-in.log 2>&1 &
      - name: Start the demo twice, check the accounts, translate the samples
        env:
          MYSQL_URL: mysql://root:root@127.0.0.1:3306/railway
        run: tests/demo-check.sh 2>&1 | tee check.log
      - if: failure()
        run: docker logs demo 2>&1 | tail -150; cat stand-in.log
      - if: failure()
        run: |
          note() { printf '::error title=%s::%s\n' "$1" "$(tail -n 60 | cut -c1-300 | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"; }
          [ -f build.log ] && note build < build.log
          [ -f check.log ] && note check < check.log
          docker logs demo 2>&1 | note demo-log || true
          [ -f stand-in.log ] && note stand-in < stand-in.log
          true
